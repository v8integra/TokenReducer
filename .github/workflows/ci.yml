name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Dev tooling (Vitest, ESLint) needs Node 22+.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node packages/cli/dist/tokentrim.js analyze --transcripts fixtures/synthetic --out smoke-out --html

  runtime-node18:
    # The bundled CLI (and later the hooks) must run on Node 18, the minimum users need.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --version
      - run: node packages/cli/dist/tokentrim.js --help
      - run: node packages/cli/dist/tokentrim.js analyze --transcripts fixtures/synthetic --out smoke-out --html --json
